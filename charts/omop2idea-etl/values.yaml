## OMOP ETL values
name: omop2idea-etl
namespace: datamesh
replicas: 1
#image: "idea2omop:latest"
image: "ghcr.io/idea4rc/etl-omop2idea:latest"
imagePullPolicy: IfNotPresent
datasource:
  metadata:
    dbPort: 5432
    dbName: metadata
    driverClassName: org.postgresql.Driver
    image: postgres:18.2-bookworm
    replicas: 1
    service:
      name: omop-etl-postgres-db
      port: 5432
      targetPort: 5432
      type: ClusterIP
  source:
    dbSvc: etl-postgres-db.datamesh.svc.cluster.local
    dbPort: 5432
    dbName: etl
    driverClassName: org.postgresql.Driver
  omop:
    dbSvc: omop-postgres-service.datamesh.svc.cluster.local
    dbPort: 5432
    dbName: omopdb
    driverClassName: org.postgresql.Driver
    schemaCDM: cdm_idea

# Additional configuration that's related to the capsule environment
idea4rcStorageClass:
  name: idea4rc-hostpath
