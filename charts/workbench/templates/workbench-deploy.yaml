#Capsule Workbench Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # The workbench does not work when running as non-root
      #securityContext:
      #  runAsNonRoot: true
      #  runAsUser: 65532
      #  runAsGroup: 65532
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          env:
            - name: BACK_END_BASE_PATH
              value: "http://{{ .Values.etl.service.name }}.{{ .Values.etl.namespace }}.svc.cluster.local:{{ .Values.etl.service.port }}/"
          ports:
            - containerPort: {{ .Values.port }}